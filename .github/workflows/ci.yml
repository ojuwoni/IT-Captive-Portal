# CI/CD du portail captif v2
#
# push sur v2 (code)  -> tests -> build image -> push registre.rber.bj
#                     -> bump du tag dans deploy/k8s/kustomization.yaml
#                        (commit [skip ci]) -> ArgoCD deploie (GitOps)
# pull request        -> tests uniquement
#
# Secrets GitHub requis (Settings -> Secrets and variables -> Actions) :
#   REGISTRY_USERNAME = robot$rber+dev-autonomie
#   REGISTRY_PASSWORD = <secret du robot>
name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

env:
  REGISTRY: registre.rber.bj
  IMAGE: registre.rber.bj/rber/captive-portal

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-push-deploy:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour le commit GitOps du tag
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:v2
      - name: GitOps — pointer le deploiement sur la nouvelle image
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" deploy/k8s/kustomization.yaml
          git config user.name  "rber-ci"
          git config user.email "ci@rber.bj"
          git add deploy/k8s/kustomization.yaml
          git commit -m "ci: deploie ${{ github.sha }} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
