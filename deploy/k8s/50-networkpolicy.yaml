# Le portail ne parle qu'a Redis, Keycloak et aux API pfSense (443/10443)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: portal-egress, namespace: captive-portal }
spec:
  podSelector: { matchLabels: { app: portal } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ port: 6379 }]
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 10443, protocol: TCP }
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
