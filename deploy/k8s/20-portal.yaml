apiVersion: apps/v1
kind: Deployment
metadata: { name: portal, namespace: captive-portal }
spec:
  replicas: 2
  selector: { matchLabels: { app: portal } }
  template:
    metadata: { labels: { app: portal } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: portal
          image: registre.rber.bj/rber/captive-portal:v2
          ports: [{ containerPort: 8000 }]
          env:
            - { name: PUBLIC_BASE_URL, value: "https://portal.rber.bj" }
            - { name: REDIS_URL, value: "redis://redis-svc:6379/0" }
            - { name: ROUTING_PATH, value: "/opt/captive-portal/config/routing.json" }
            - { name: SECRETS_DIR, value: "/opt/captive-portal/secrets" }
            - { name: KEYCLOAK_CLIENT_SECRET_FILE, value: "/opt/captive-portal/kc/client-secret" }
            - { name: SECRET_KEY, valueFrom: { secretKeyRef: { name: portal-secret-key, key: secret-key } } }
            # TRUSTED_PROXIES : adapter au CIDR des pods de l'ingress
            - { name: TRUSTED_PROXIES, value: "10.42.0.0/16,127.0.0.1/32" }
          volumeMounts:
            - { name: routing, mountPath: /opt/captive-portal/config, readOnly: true }
            - { name: pfsense-keys, mountPath: /opt/captive-portal/secrets, readOnly: true }
            - { name: kc, mountPath: /opt/captive-portal/kc, readOnly: true }
            - { name: themes, mountPath: /opt/captive-portal/themes, readOnly: true }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources:
            requests: { memory: 256Mi, cpu: 250m }
            limits: { memory: 512Mi, cpu: 500m }
      volumes:
        - name: routing
          configMap: { name: campus-routing }
        - name: themes
          configMap: { name: portal-themes, optional: true }
        - name: kc
          secret: { secretName: keycloak-client }
        - name: pfsense-keys
          # UN SEUL Secret pour tous les campus : une entree par site,
          # nommee comme le champ api_key_secret de routing.json.
          # Ajouter un site = ajouter une entree a ce Secret, rien d'autre :
          #   kubectl -n captive-portal patch secret pfsense-keys \
          #     -p '{"stringData":{"pfsense-key-nouveau":"<CLE>"}}'
          secret: { name: pfsense-keys }
---
apiVersion: v1
kind: Service
metadata: { name: portal-svc, namespace: captive-portal }
spec:
  selector: { app: portal }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: portal-hpa, namespace: captive-portal }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: portal }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
