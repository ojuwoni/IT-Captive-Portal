<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ theme.portal_title }} — {{ theme.name }}</title>
<style>{{ css_variables }}</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,var(--background-start),var(--background-end));
 color:var(--text);padding:16px}
.card{background:var(--card);border-radius:12px;max-width:420px;width:100%;
 padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.card img.logo{max-width:120px;max-height:120px;margin-bottom:16px}
h1{font-size:1.4rem;margin-bottom:4px}
p.sub{color:var(--muted);margin-bottom:20px;font-size:.95rem}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:8px;
 background:var(--primary);color:#fff;font-size:1rem;cursor:pointer;
 text-decoration:none;margin-top:12px}
.btn:hover{background:var(--primary-hover)}
.meta{font-size:.8rem;color:var(--muted);margin-top:18px}
.err{color:var(--error);font-weight:600;margin:12px 0}
ul.campus{list-style:none;text-align:left;margin-top:12px}
ul.campus a{display:block;padding:10px;border-radius:6px;color:var(--text);
 text-decoration:none;border:1px solid #e2e8f0;margin-bottom:6px}
</style>
{% if theme.has_custom_css %}<link rel="stylesheet" href="/themes/{{ theme.id }}/custom.css">{% endif %}
</head>
<body>
<div class="card">
{% if theme.logo %}<img class="logo" src="{{ theme.logo }}" alt="logo">{% endif %}
{% block content %}{% endblock %}
<p class="meta">{{ theme.footer }}</p>
</div>
</body>
</html>
